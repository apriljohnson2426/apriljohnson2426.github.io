<!doctype html>
<head>
    <script src="math.js" type="text/javascript"></script>
</head>
<body>
    <form id="carriageInputForm">
        <input type="text" id="carriageInput" style="width: 100px;"></input>
        <input type="text" id="targetValue" style="width: 100px;" value="10"></input>
        <button type="submit">Submit</button>
    </form>
    <div id="solutionsBox" style="height: 480; overflow: auto">
        <p id="solutionList"></p>
    </div>
</body>
<script type="text/javascript" src="main-20260722.js"></script>
<script>
    const carriageInputForm = document.getElementById("carriageInputForm");
    carriageInputForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const carriageInput = document.getElementById("carriageInput").value;
        const targetValue = document.getElementById("targetValue").value;
        train.carriages[carriageInput].findSolutions(targetValue);
        const solutionsBox = document.getElementById("solutionsBox");
        let output = `${train.carriages[carriageInput].solutions.length} solutions\n`;
        train.carriages[carriageInput].solutions.forEach((solution) => {
            output += solution.equation;
            output += `\n`;
        });
        const solutionList = document.getElementById("solutionList");
        solutionList.innerText = output;
    });
</script>
